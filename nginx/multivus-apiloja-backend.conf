# Configuração Nginx para MULTIVUS Loja - BACKEND (API)
# Domínio: apiloja.multivus.com.br
# Porta: 3256
# Salve este arquivo em /etc/nginx/sites-available/multivus-apiloja
# Depois crie um link simbólico: sudo ln -s /etc/nginx/sites-available/multivus-apiloja /etc/nginx/sites-enabled/
#
# IMPORTANTE: Substitua "apiloja.multivus.com.br" pelo seu subdomínio real antes de usar!

# ============================================
# HTTP - Redireciona para HTTPS (após SSL configurado)
# ============================================
server {
    listen 80;
    listen [::]:80;
    server_name apiloja.multivus.com.br;

    # Tamanho máximo de upload (importante para uploads funcionarem)
    client_max_body_size 50M;

    # Permitir Let's Encrypt (necessário para validação inicial)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirecionar todo o resto para HTTPS
    # IMPORTANTE: Descomente a linha abaixo APÓS configurar SSL com Certbot
    # return 301 https://$server_name$request_uri;
    
    # ANTES de configurar SSL, mantenha o proxy abaixo ativo:
    # Após configurar SSL, o Certbot adicionará automaticamente o redirecionamento
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript;

    # Proxy para rotas /api/* e /admin/api/* para o Next.js Backend (porta 3256)
    location ~ ^/(api|admin/api) {
        proxy_pass http://localhost:3256;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # CORS headers
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Access-Control-Allow-Credentials "true" always;
        
        # Handle preflight
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Bloquear acesso a rotas que não são API
    location / {
        return 404;
    }
}

