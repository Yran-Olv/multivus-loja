# Configuração Nginx para MULTIVUS Loja - FRONTEND
# Domínio: multivus.com.br
# Porta: 3255
# Salve este arquivo em /etc/nginx/sites-available/multivus-loja
# Depois crie um link simbólico: sudo ln -s /etc/nginx/sites-available/multivus-loja /etc/nginx/sites-enabled/
#
# IMPORTANTE: Substitua "multivus.com.br" pelo seu domínio real antes de usar!

# ============================================
# HTTP - Redireciona para HTTPS (após SSL configurado)
# ============================================
server {
    listen 80;
    listen [::]:80;
    server_name multivus.com.br;

    # Tamanho máximo de upload (importante para uploads funcionarem)
    client_max_body_size 50M;

    # Permitir Let's Encrypt (necessário para validação inicial)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Servir arquivos de upload diretamente do sistema de arquivos (mais eficiente)
    # IMPORTANTE: location /uploads SEM barra final, alias COM barra final
    # Uploads são arquivos estáticos servidos diretamente pelo Nginx, sem passar pelo Next.js
    location /uploads {
        alias __PROJECT_DIR__/public/uploads/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        
        # Bloquear acesso a arquivos potencialmente perigosos
        location ~* \.(php|phtml|phar|pl|py|jsp|asp|cgi|sh|bash|exe|dll|bin)$ {
            deny all;
            return 403;
        }
    }

    # Redirecionar todo o resto para HTTPS
    # IMPORTANTE: Descomente a linha abaixo APÓS configurar SSL com Certbot
    # return 301 https://$server_name$request_uri;

    # ANTES de configurar SSL, mantenha o proxy abaixo ativo:
    # Após configurar SSL, o Certbot adicionará automaticamente o redirecionamento
    location / {
        proxy_pass http://localhost:3255;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

