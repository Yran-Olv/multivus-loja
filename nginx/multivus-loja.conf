# Configuração Nginx para MULTIVUS Loja
# Frontend e Backend com domínios separados
# Salve este arquivo em /etc/nginx/sites-available/multivus-loja.conf
# Depois crie um link simbólico: sudo ln -s /etc/nginx/sites-available/multivus-loja.conf /etc/nginx/sites-enabled/

# ============================================
# FRONTEND - multivus.com.br
# ============================================
server {
    listen 80;
    listen [::]:80;
    server_name multivus.com.br;

    # Tamanho máximo de upload
    client_max_body_size 50M;

    # Logs
    access_log /var/log/nginx/multivus-frontend-access.log;
    error_log /var/log/nginx/multivus-frontend-error.log;

    # Permitir Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Proxy para o Next.js Frontend (porta 3000)
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Cache para arquivos estáticos
    location /_next/static {
        proxy_pass http://localhost:3000;
        proxy_cache_valid 200 60m;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        add_header Cache-Control "public, immutable";
        expires 1y;
    }

    # Arquivos públicos
    location /public {
        proxy_pass http://localhost:3000;
        proxy_cache_valid 200 30m;
        add_header Cache-Control "public";
        expires 1h;
    }

    # Favicon e outros arquivos pequenos
    location ~* \.(ico|jpg|jpeg|png|gif|svg|webp|woff|woff2|ttf|eot)$ {
        proxy_pass http://localhost:3000;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# ============================================
# BACKEND (API) - api.multivus.com.br
# ============================================
server {
    listen 80;
    listen [::]:80;
    server_name api.multivus.com.br;

    # Tamanho máximo de upload
    client_max_body_size 50M;

    # Logs
    access_log /var/log/nginx/multivus-backend-access.log;
    error_log /var/log/nginx/multivus-backend-error.log;

    # Permitir Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript;

    # Proxy para o Next.js Backend (porta 3255)
    # Roteia apenas /api/* para o backend
    location /api {
        proxy_pass http://localhost:3255;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # CORS headers (se necessário)
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Access-Control-Allow-Credentials "true" always;
        
        # Handle preflight
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Bloquear acesso a rotas que não são API
    location / {
        return 404;
    }
}

