# Frontend local — Nginx no host, app no Docker (porta 3255)
# Instalado por: scripts/install.sh / scripts/update.sh

server {
    listen 80;
    listen [::]:80;
    server_name __FRONTEND_HOST__ www.__FRONTEND_HOST__;

    client_max_body_size 50M;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /uploads {
        alias __PROJECT_DIR__/public/uploads/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;

        location ~* \.(php|phtml|phar|pl|py|jsp|asp|cgi|sh|bash|exe|dll|bin)$ {
            deny all;
            return 403;
        }
    }

    location / {
        proxy_pass http://127.0.0.1:__FRONTEND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
